# This file contains pin mappings for the stock 2021 Creality Ender 3
# S1 & S1 Pro. To use this config, check the STM32 Chip on the
# Mainboard, during "make menuconfig" select accordingly either the
# STM32F103 with "28KiB bootloader" or the STM32F401 with
# "64KiB bootloader" and serial (on USART1 PA10/PA9) for both.

# For a direct serial connection, in "make menuconfig" select
# "Enable extra low-level configuration options" and  Serial
# (on USART2 PA3/PA2), which is on the 10 pin IDC cable used
# for the LCD module as follows: 3: Tx, 4: Rx, 9: GND, 10: VCC

# Flash this firmware by copying "out/klipper.bin" to a SD card and
# turning on the printer with the card inserted. The filename
# must be changed to "firmware.bin"

# With STM32F401, you might need to put "firmware.bin" in a
# folder on the SD card called "STM32F4_UPDATE" in order to flash.

# See docs/Config_Reference.md for a description of parameters.

# Input Shaper Config
# Comment out when input shaper is not plugged in
# [include PIS.cfg]

# Mainsail
[include mainsail.cfg]

# Custom Macros
[include custom_macros/macros.cfg]
[include custom_macros/probe.cfg]
[include custom_macros/prompts.cfg]

# Klipper Timelapse
[include timelapse.cfg]

[stepper_x]
step_pin: PC2
dir_pin: PB9
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: !PA5
position_endstop: -10
position_max: 235
position_min: -15
homing_speed: 50

[stepper_y]
step_pin: PB8
dir_pin: PB7
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: !PA6
position_endstop: -8
position_max: 238
position_min: -13
homing_speed: 50

[stepper_z]
step_pin: PB6
dir_pin: !PB5
enable_pin: !PC3
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_max: 270
position_min: -4

[extruder]
step_pin: PB4
dir_pin: PB3
enable_pin: !PC3
microsteps: 16
gear_ratio: 42:12
rotation_distance: 26.359
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA1
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC5
#control: pid
#pid_Kp: 23.561
#pid_Ki: 1.208
#pid_Kd: 114.859
min_temp: 0
max_temp: 300 # Set to 300 for S1 Pro
#pressure_advance: 0.0621

[heater_bed]
heater_pin: PA7
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
#control: pid
#pid_Kp: 71.867
#pid_Ki: 1.536
#pid_Kd: 840.843
min_temp: 0
max_temp: 110 # Set to 110 for S1 Pro

[heater_fan hotend_fan]
pin: PC0

[fan]
pin: PA0

[mcu]
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
baud: 250000
restart_method: command

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3400
max_z_velocity: 15
max_z_accel: 300
square_corner_velocity: 5.0

[bltouch]
sensor_pin: ^PC14
control_pin: PC13
x_offset: -31.8
y_offset: -40.5
speed: 5
lift_speed: 10
samples: 3
sample_retract_dist: 3.0
samples_result: median
samples_tolerance: 0.015
samples_tolerance_retries: 5
probe_with_touch_mode: true
stow_on_each_sample: false

[bed_mesh]
speed: 120
horizontal_move_z: 6
mesh_min: 10, 10
mesh_max: 202, 196
probe_count: 9, 9
algorithm: bicubic
bicubic_tension: 0.2
mesh_pps: 2, 2
fade_start: 1
fade_end: 10
fade_target: 0
zero_reference_position: 115.2, 113.5
adaptive_margin: 5

[safe_z_home]
home_xy_position: 147, 154
speed: 100
z_hop: 10
z_hop_speed: 50

[filament_switch_sensor e0_sensor]
switch_pin: !PC15
pause_on_runout: true
runout_gcode: PAUSE

[virtual_sdcard]
path: ~/printer_data/gcodes
[display_status]
[pause_resume]
recover_velocity: 25

[bed_screws]
screw1: 20, 29
screw2: 195, 29
screw3: 195, 198
screw4: 20, 198

[screws_tilt_adjust]
screw1: 51.8, 69.5
screw1_name: front left
screw2: 226.8, 69.5
screw2_name: front right
screw3: 226.8, 237
screw3_name: rear right
screw4: 51.8, 237
screw4_name: rear left
horizontal_move_z: 8
speed: 120
screw_thread: CW-M4

[input_shaper]
shaper_freq_x: 80.8
shaper_type_x: 3hump_ei
shaper_freq_y: 33.8
shaper_type_y: mzv

[respond]

