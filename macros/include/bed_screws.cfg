####################################
## Bed Screws Adjustment
####################################

# Probe-based: homes then calculates how much to turn each screw
[gcode_macro SCREWS_TILT_CALIBRATE]
description: Home and calculate bed screw adjustments using the probe
gcode:
    G28
    SCREWS_TILT_CALCULATE

# Manual: homes then walks the nozzle to each screw for the paper test
[gcode_macro BED_SCREWS_CALIBRATE]
description: Home and manually adjust bed leveling screws
gcode:
    G28
    BED_SCREWS_ADJUST
